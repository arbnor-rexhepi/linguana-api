<!DOCTYPE html>
{% load static %} {% load custom_tags %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto&display=swap");

      .container {
        margin: 0px;
        font-family: "Roboto", sans-serif;
        text-align: center;
      }

      .header {
        padding: 40px 20px;
        max-width: 600px;
        margin: auto;
      }

      .logo-text {
        color: black;
        font-family: "Generalsans", sans-serif;
        margin-left: 10px;
        font-size: 22px;
        width: 91;
      }

      .footer {
        background-color: black;
        padding: 24px 20px;
        margin-top: 24px;
      }

      .footer-container {
        max-width: 600px;
        margin: auto;
      }

      .footer p {
        color: #c1d0df;
        font-size: 10px;
        line-height: 20px;
        text-align: center;
      }

      .socials {
        padding: 24px;
        gap: 10px;
        border-top: #c1d0df 0.5px solid;
        max-width: 600px;
        margin: auto;
        margin-top: 24px;
      }

      .social-buttons {
        margin: auto;
        text-align: center;
      }

      .content {
        padding: 20px 20px;
        max-width: 600px;
        align-self: center;
        margin: auto;
      }

      .main-title {
        color: #2a51f4;
        font-size: 14px;
        font-weight: bold;
      }

      .header-title {
        color: #1d1d1e;
        font-size: 36px;
        font-weight: bold;
        margin-top: 24px;
        margin-bottom: 24px;
      }

      .description {
        color: #1d1d1e;
        font-size: 16px;
        line-height: 28px;
        font-weight: normal;
        margin-bottom: 24px;
        margin-top: 24px;
      }

      .action-button {
        color: white;
        background-color: #2a51f4;
        padding: 8px 24px;
        border-radius: 8px;
        height: 42px;
        font-weight: bold;
        margin-top: 24px;
        width: 140px;
        text-decoration: none;
        margin-bottom: 24px;
      }

      .action-button span {
        color: white;
      }

      .footer-link {
        text-decoration: none;
      }

      .footer-link span {
        color: #c1d0df;
      }

      .description a {
        color: #2a51f4;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <img
          src="{% settings_value 'STATIC_FILES_HOST' %}{% static 'images/logo-text-2.png' %}"
          height="52"
        />
      </div>
      <div class="content">{% block content %}{% endblock %}</div>
      <div class="footer">
        <div class="footer-container">
          <p>© 2022 Linguana.io All rights reserved.</p>
        </div>
      </div>
    </div>
  </body>
</html>
